name: Actualizar noticias Steel Frame AR

on:
  schedule:
    - cron: "0 9 * * *"   # todos los días 09:00 UTC (~06:00 Argentina)
  workflow_dispatch: {}     # permite correrlo manualmente desde GitHub

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recolectar noticias
        run: python src/fetch_sources.py

      - name: Filtrar, deduplicar y resumir
        run: python src/filter_dedupe.py

      - name: Generar sitio
        run: python src/generate_site.py

      - name: Exportar datos para Power BI (CSV y JSON)
        run: |
          python - <<'PY'
          import csv, json, shutil
          from pathlib import Path

          src = Path("data/news.json")
          data = json.loads(src.read_text(encoding="utf-8"))

          # news.json puede ser una lista de noticias o un dict que contiene la lista
          if isinstance(data, dict):
              items = next((v for v in data.values() if isinstance(v, list)), [data])
          else:
              items = data
          items = [i for i in items if isinstance(i, dict)]

          # columnas = unión de todas las claves, en orden de aparición
          cols = []
          for it in items:
              for k in it:
                  if k not in cols:
                      cols.append(k)

          def cell(v):
              if isinstance(v, (list, dict)):
                  return json.dumps(v, ensure_ascii=False)
              return "" if v is None else v

          Path("output").mkdir(exist_ok=True)
          # utf-8-sig para que Power BI y Excel lean bien las tildes
          with open("output/noticias.csv", "w", newline="", encoding="utf-8-sig") as f:
              w = csv.writer(f)
              w.writerow(cols)
              for it in items:
                  w.writerow([cell(it.get(c)) for c in cols])

          shutil.copy(src, "output/noticias.json")
          print(f"Exportadas {len(items)} noticias a output/noticias.csv y output/noticias.json")
          PY

      - name: Commitear datos y sitio actualizados
        run: |
          git config user.name "steelframe-bot"
          git config user.email "actions@github.com"
          git add data/news.json data/discarded_items.json output/index.html
          git diff --quiet --cached || git commit -m "Actualización automática de noticias $(date -u +%Y-%m-%d)"
          git push

      - name: Publicar en GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
